name: Profile Interaction

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  move-signal:
    if: startsWith(github.event.issue.title, 'profile-move:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Parse bounded move
        id: move
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, re, sys
          title=os.environ.get("ISSUE_TITLE",""); body=os.environ.get("ISSUE_BODY","")
          m=re.search(r"\bMOVE\s*=\s*([A-H][1-8])\b",body.upper()) or re.search(r"PROFILE-MOVE:\s*([A-H][1-8])\b",title.upper())
          move=m.group(1) if m else ""
          if move not in {"A1","C3","F5","H7"}:
              print("INVALID_MOVE"); sys.exit(2)
          state={"position":move,"actor":os.environ.get("ISSUE_ACTOR","unknown")[:39],"issue":int(os.environ.get("ISSUE_NUMBER","0")),"updated_at":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/signal.json").write_text(json.dumps(state,indent=2))
          print("MOVE_APPLIED="+move)
          PY
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Regenerate profile assets
        if: steps.move.outputs.valid == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile.py
      - name: Commit signal state
        if: steps.move.outputs.valid == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signal.json assets/generated
          git commit -m "chore(profile): move visitor signal" || exit 0
          git pull --rebase origin main
          git push
      - name: Acknowledge valid move
        if: steps.move.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Signal move accepted. The profile board has been updated."
          gh issue close "$ISSUE_NUMBER" --reason completed
      - name: Reject invalid move
        if: steps.move.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Invalid profile move. Allowed positions are A1, C3, F5, and H7."
          gh issue close "$ISSUE_NUMBER" --reason not_planned
