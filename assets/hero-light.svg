<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">RYF — Chess-themed AI-native builder</title>
<desc id="desc">Light chessboard profile banner for Ryf.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.58" stop-color="#faf8ff"/>
    <stop offset="1" stop-color="#fffdf5"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9a7b24"/>
    <stop offset="0.5" stop-color="#7c3aed"/>
    <stop offset="1" stop-color="#9a7b24"/>
  </linearGradient>
  <pattern id="board" width="72" height="72" patternUnits="userSpaceOnUse">
    <rect width="72" height="72" fill="#f6f8fa"/>
    <rect width="36" height="36" fill="#d8dee4"/>
    <rect x="36" y="36" width="36" height="36" fill="#d8dee4"/>
  </pattern>
</defs>
<rect width="1200" height="420" rx="34" fill="url(#bg)"/>
<rect x="800" y="48" width="320" height="320" rx="26" fill="url(#board)" opacity=".70"/>
<rect x="800" y="48" width="320" height="320" rx="26" fill="none" stroke="#d0d7de"/>
<rect x="54" y="50" width="1092" height="320" rx="26" fill="none" stroke="#d0d7de"/>
<text x="88" y="140" fill="#1f2328" font-size="78" font-weight="800" font-family="Segoe UI, Inter, Arial, sans-serif" letter-spacing="10">RYF</text>
<text x="308" y="140" fill="#9a7b24" font-size="72" font-family="Segoe UI Symbol, Segoe UI, Arial, sans-serif">♔</text>
<rect x="90" y="164" width="462" height="5" rx="2.5" fill="url(#line)"/>
<text x="90" y="218" fill="#24292f" font-size="28" font-weight="650" font-family="Segoe UI, Inter, Arial, sans-serif" letter-spacing="2">AI-NATIVE PRODUCT BUILDER</text>
<text x="90" y="270" fill="#24292f" font-size="22" font-family="Segoe UI, Inter, Arial, sans-serif">STRATEGY · SYSTEMS · EXECUTION</text>
<text x="90" y="316" fill="#57606a" font-size="18" font-family="Segoe UI, Inter, Arial, sans-serif">Human authority stays explicit. AI moves fast.</text>
<text x="960" y="238" text-anchor="middle" fill="#1f2328" font-size="108" font-family="Segoe UI Symbol, Segoe UI, Arial, sans-serif">♔</text>
</svg>