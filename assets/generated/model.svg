<rect x="70" y="112" width="126" height="96" rx="16" fill="#0d1117" stroke="#e3bd62" stroke-opacity=".65"/><circle cx="88" cy="132" r="4" fill="#e3bd62"/><text x="86" y="158" fill="#f0f6fc" font-size="14" font-weight="800" font-family="Segoe UI">HUMAN INTENT</text><text x="86" y="180" fill="#7d8590" font-size="9.8" font-family="Segoe UI">Define goals, constraints,</text><text x="86" y="196" fill="#7d8590" font-size="9.8" font-family="Segoe UI">and authority</text><rect x="250" y="112" width="126" height="96" rx="16" fill="#0d1117" stroke="#a78bfa" stroke-opacity=".65"/><circle cx="268" cy="132" r="4" fill="#a78bfa"/><text x="266" y="158" fill="#f0f6fc" font-size="14" font-weight="800" font-family="Segoe UI">AI AGENTS</text><text x="266" y="180" fill="#7d8590" font-size="9.8" font-family="Segoe UI">Explore, draft, implement,</text><text x="266" y="196" fill="#7d8590" font-size="9.8" font-family="Segoe UI">and analyze</text><rect x="430" y="112" width="126" height="96" rx="16" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".65"/><circle cx="448" cy="132" r="4" fill="#58a6ff"/><text x="446" y="158" fill="#f0f6fc" font-size="14" font-weight="800" font-family="Segoe UI">BUILD</text><text x="446" y="180" fill="#7d8590" font-size="9.8" font-family="Segoe UI">Turn intent into</text><text x="446" y="196" fill="#7d8590" font-size="9.8" font-family="Segoe UI">working software</text><rect x="610" y="112" width="126" height="96" rx="16" fill="#0d1117" stroke="#63e6a1" stroke-opacity=".65"/><circle cx="628" cy="132" r="4" fill="#63e6a1"/><text x="626" y="158" fill="#f0f6fc" font-size="14" font-weight="800" font-family="Segoe UI">VERIFY</text><text x="626" y="180" fill="#7d8590" font-size="9.8" font-family="Segoe UI">Review, test, and</text><text x="626" y="196" fill="#7d8590" font-size="9.8" font-family="Segoe UI">inspect evidence</text><rect x="790" y="112" width="126" height="96" rx="16" fill="#0d1117" stroke="#a78bfa" stroke-opacity=".65"/><circle cx="808" cy="132" r="4" fill="#a78bfa"/><text x="806" y="158" fill="#f0f6fc" font-size="14" font-weight="800" font-family="Segoe UI">AUTOMATE</text><text x="806" y="180" fill="#7d8590" font-size="9.8" font-family="Segoe UI">Encode repeatable</text><text x="806" y="196" fill="#7d8590" font-size="9.8" font-family="Segoe UI">execution paths</text><rect x="970" y="112" width="126" height="96" rx="16" fill="#0d1117" stroke="#e3bd62" stroke-opacity=".65"/><circle cx="988" cy="132" r="4" fill="#e3bd62"/><text x="986" y="158" fill="#f0f6fc" font-size="14" font-weight="800" font-family="Segoe UI">SHIP</text><text x="986" y="180" fill="#7d8590" font-size="9.8" font-family="Segoe UI">Publish reusable</text><text x="986" y="196" fill="#7d8590" font-size="9.8" font-family="Segoe UI">public artifacts</text>

<circle cx="210" cy="224" r="4" fill="#63e6a1">
  <animate attributeName="cx" values="210;930;210" dur="7.2s" repeatCount="indefinite"/>
  <animate attributeName="fill" values="#e3bd62;#a78bfa;#58a6ff;#63e6a1;#e3bd62" dur="7.2s" repeatCount="indefinite"/>
