<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img">
<title>RYF operating model</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e3bd62"/>
    <stop offset=".52" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#63e6a1"/>
  </linearGradient>
  <radialGradient id="radarGlow">
    <stop offset="0" stop-color="#63e6a1" stop-opacity=".20"/>
    <stop offset="1" stop-color="#63e6a1" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-300%" y="-300%" width="600%" height="600%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="1" y="1" width="1118" height="358" rx="26" fill="#080a0e" stroke="#21262d"/>

<text x="36" y="42" fill="#7d8590" font-size="11.5" font-family="Segoe UI" letter-spacing="2.4">OPERATING MODEL / HOW I SHIP</text>
<text x="36" y="80" fill="#f0f6fc" font-size="28" font-weight="800" font-family="Segoe UI">HUMAN AUTHORITY → AI EXECUTION → VERIFIED OUTPUT</text>
<text x="36" y="102" fill="#7d8590" font-size="12.5" font-family="Segoe UI">The profile is dynamic; the engineering model underneath it is deliberate.</text>

