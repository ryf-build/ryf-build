<path d="M70 236H1040" stroke="#27303a" opacity=".55"/>
<circle cx="70" cy="268" r="4" fill="#e3bd62"/><text x="84" y="272" fill="#f0f6fc" font-size="11.5" font-weight="700" font-family="Segoe UI">AUTHORITY</text><text x="84" y="292" fill="#7d8590" font-size="10.5" font-family="Segoe UI">Human decisions stay explicit</text><circle cx="325" cy="268" r="4" fill="#63e6a1"/><text x="339" y="272" fill="#f0f6fc" font-size="11.5" font-weight="700" font-family="Segoe UI">QUALITY</text><text x="339" y="292" fill="#7d8590" font-size="10.5" font-family="Segoe UI">Evidence before release</text><circle cx="580" cy="268" r="4" fill="#a78bfa"/><text x="594" y="272" fill="#f0f6fc" font-size="11.5" font-weight="700" font-family="Segoe UI">BOUNDARY</text><text x="594" y="292" fill="#7d8590" font-size="10.5" font-family="Segoe UI">Production remains private</text><circle cx="835" cy="268" r="4" fill="#58a6ff"/><text x="849" y="272" fill="#f0f6fc" font-size="11.5" font-weight="700" font-family="Segoe UI">OUTPUT</text><text x="849" y="292" fill="#7d8590" font-size="10.5" font-family="Segoe UI">Reusable ideas become public</text>

